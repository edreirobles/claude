<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña — PostLinked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #EBF3FC 0%, #fff 60%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,.10);
    }
    .logo {
      font-size: 20px;
      font-weight: 900;
      color: #0A66C2;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    p.subtitle { font-size: 14px; color: #4B5563; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    input[type=password] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 16px;
    }
    input[type=password]:focus { border-color: #0A66C2; }
    .btn {
      width: 100%;
      padding: 13px;
      background: #0A66C2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover { background: #004182; }
    .btn:disabled { background: #9CA3AF; cursor: not-allowed; }
    .msg {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .msg-error { background: #FEE2E2; color: #991B1B; }
    .msg-success { background: #D1FAE5; color: #065F46; }
    .back-link { text-align: center; margin-top: 20px; font-size: 13px; color: #4B5563; }
    .back-link a { color: #0A66C2; font-weight: 600; text-decoration: none; }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3); border-radius: 50%;
      border-top-color: #fff; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#0A66C2"/><path d="M8 12h4v12H8zM10 10.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM14 12h4v1.6c.6-1 1.8-1.8 3.4-1.8 3.2 0 4.6 2 4.6 5.4V24h-4v-6c0-1.6-.6-2.8-2-2.8s-2.2 1.2-2.2 2.8v6h-3.8V12z" fill="white"/></svg>
      PostLinked
    </div>

    <div id="form-view">
      <h1>Nueva contraseña</h1>
      <p class="subtitle">Elige una contraseña segura. Debe tener al menos 8 caracteres.</p>

      <div class="msg msg-error" id="err-msg"></div>
      <div class="msg msg-success" id="ok-msg"></div>

      <label for="new-password">Nueva contraseña</label>
      <input type="password" id="new-password" placeholder="Mínimo 8 caracteres" />

      <label for="confirm-password">Confirmar contraseña</label>
      <input type="password" id="confirm-password" placeholder="Repite tu contraseña" />

      <button class="btn" id="submit-btn" onclick="doReset()">
        Guardar contraseña
      </button>

      <div class="back-link"><a href="/">Volver al inicio</a></div>
    </div>

    <div id="success-view" style="display:none; text-align:center;">
      <div style="font-size:48px; margin-bottom:16px;">✅</div>
      <h1 style="margin-bottom:12px;">¡Listo!</h1>
      <p class="subtitle">Tu contraseña ha sido actualizada. Ya puedes iniciar sesión con tu nueva contraseña.</p>
      <a href="/" class="btn" style="text-decoration:none; margin-top:8px;">Ir a iniciar sesión</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('err-msg').textContent = 'Enlace inválido. Solicita uno nuevo desde la página de inicio.';
      document.getElementById('err-msg').style.display = 'block';
      document.getElementById('submit-btn').disabled = true;
    }

    async function doReset() {
      const newPass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;
      const errEl = document.getElementById('err-msg');
      const btn = document.getElementById('submit-btn');

      errEl.style.display = 'none';

      if (newPass.length < 8) {
        errEl.textContent = 'La contraseña debe tener al menos 8 caracteres.';
        errEl.style.display = 'block';
        return;
      }
      if (newPass !== confirmPass) {
        errEl.textContent = 'Las contraseñas no coinciden.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Guardando...';

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPass }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.detail || 'Error al restablecer la contraseña.');

        document.getElementById('form-view').style.display = 'none';
        document.getElementById('success-view').style.display = 'block';
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = 'Guardar contraseña';
      }
    }

    // Submit con Enter
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doReset();
    });
  </script>
</body>
</html>
