<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — CV Matcher</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    window.SUPABASE_URL = "{{ supabase_url }}";
    window.SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
    window.AUTH_ENABLED = {{ 'true' if auth_enabled else 'false' }};
  </script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="#2563EB"/><path d="M7 14h14M7 9h9M7 19h11" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <span>CV Matcher</span>
      </a>
      <div class="header-controls">
        <button class="btn-icon" id="lang-toggle"><span id="lang-label"></span></button>
        <button class="btn-icon" id="dark-toggle">
          <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg id="icon-moon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container" style="max-width:420px">
      <div class="hero" style="margin-bottom:28px">
        <h1 style="font-size:1.8rem" data-i18n="login_title"></h1>
        <p class="subtitle" style="font-size:0.95rem" data-i18n="login_subtitle"></p>
      </div>

      <div class="card">
        <!-- Google button -->
        <button id="google-btn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-primary);font-size:0.95rem;font-weight:500;cursor:pointer;margin-bottom:18px">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continuar con Google
        </button>

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
          <hr style="flex:1;border:none;border-top:1px solid var(--border)">
          <span style="font-size:0.8rem;color:var(--text-faint)">o</span>
          <hr style="flex:1;border:none;border-top:1px solid var(--border)">
        </div>

        <!-- Email form -->
        <div id="email-form">
          <div class="input-group" style="margin-bottom:16px">
            <label for="email" data-i18n="login_email_label"></label>
            <input type="email" id="email" class="input" data-i18n-ph="login_email_ph" autocomplete="email" />
          </div>
          <button class="btn-primary" id="send-link-btn" style="width:100%;justify-content:center" data-i18n="login_btn"></button>
          <p id="login-error" class="error-message hidden"></p>
        </div>

        <!-- Sent confirmation -->
        <div id="sent-state" class="hidden" style="text-align:center;padding:16px 0">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none" style="margin:0 auto 14px"><circle cx="28" cy="28" r="28" fill="#EFF6FF"/><path d="M14 28l9 9 19-19" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h3 style="font-size:1.1rem;font-weight:700;color:var(--text-primary);margin-bottom:8px" data-i18n="login_sent_title"></h3>
          <p style="color:var(--text-muted);font-size:0.9rem" data-i18n="login_sent_desc"></p>
          <p id="sent-email" style="font-weight:600;color:var(--text-primary);margin-top:6px"></p>
        </div>
      </div>

      <p style="text-align:center;font-size:0.82rem;color:var(--text-faint);margin-top:16px" data-i18n="login_no_password"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // If already logged in, redirect to app
      const session = await getSession();
      if (session) { window.location.href = "/"; return; }

      document.getElementById("send-link-btn").addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) return;
        const btn = document.getElementById("send-link-btn");
        btn.disabled = true;
        const err = await signInWithEmail(email);
        if (err) {
          const errEl = document.getElementById("login-error");
          errEl.textContent = err.message;
          errEl.classList.remove("hidden");
          btn.disabled = false;
        } else {
          document.getElementById("email-form").classList.add("hidden");
          document.getElementById("sent-state").classList.remove("hidden");
          document.getElementById("sent-email").textContent = email;
        }
      });

      document.getElementById("email").addEventListener("keydown", e => {
        if (e.key === "Enter") document.getElementById("send-link-btn").click();
      });

      document.getElementById("google-btn").addEventListener("click", async () => {
        const err = await signInWithGoogle();
        if (err) alert(err.message);
      });
    });
  </script>
</body>
</html>
