<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Signing in… — CV Matcher</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    window.SUPABASE_URL = "{{ supabase_url }}";
    window.SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
    window.AUTH_ENABLED = true;
  </script>
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh">
    <div style="text-align:center">
      <div class="spinner" style="margin:0 auto 16px"></div>
      <p style="color:var(--text-muted)">Signing you in…</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const sb = initSupabase();
      if (!sb) { window.location.href = "/"; return; }
      await new Promise(r => setTimeout(r, 800));
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = "/login"; return; }

      // If user just generated anonymously, claim it now
      const claimToken = localStorage.getItem("cv_claim_token");
      if (claimToken) {
        localStorage.removeItem("cv_claim_token");
        try {
          const form = new FormData();
          form.append("claim_token", claimToken);
          const resp = await fetch("/api/claim", {
            method: "POST",
            headers: { "Authorization": "Bearer " + session.access_token },
            body: form,
          });
          if (resp.ok) {
            const { id } = await resp.json();
            window.location.href = `/?download=${id}`;
            return;
          }
        } catch (e) { /* fall through to home */ }
      }

      window.location.href = "/";
    });
  </script>
</body>
</html>
