<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Signing in… — CV Matcher</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    window.SUPABASE_URL = "{{ supabase_url }}";
    window.SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
    window.AUTH_ENABLED = true;
  </script>
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh">
    <div style="text-align:center">
      <div class="spinner" style="margin:0 auto 16px"></div>
      <p style="color:var(--text-muted)">Signing you in…</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const sb = initSupabase();
      if (!sb) { window.location.href = "/"; return; }

      // Listen for auth state — fires as soon as Supabase processes the
      // hash token (magic link) or PKCE code (Google OAuth)
      let redirected = false;
      sb.auth.onAuthStateChange((event, session) => {
        if (redirected) return;
        if (event === "SIGNED_IN" || event === "TOKEN_REFRESHED") {
          redirected = true;
          window.location.href = "/";
        }
      });

      // Fallback: if already signed in or event never fires, redirect after 3s
      await new Promise(r => setTimeout(r, 3000));
      if (!redirected) {
        const { data: { session } } = await sb.auth.getSession();
        redirected = true;
        window.location.href = session ? "/" : "/login";
      }
    });
  </script>
</body>
</html>
